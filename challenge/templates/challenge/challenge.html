{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RPG Learning</title>

    <link
        rel="stylesheet"
        href="{% static 'challenge/css/challenge.css' %}"
    >
</head>

<body>
    <div class="mobile-app">

        <form id="csrf-form" style="display: none;">
            {% csrf_token %}
        </form>

        <section id="challenge-root"></section>

        {{ challengeData|json_script:"challenge-data" }}
        {{ questionData|json_script:"question-data" }}

    </div>

    <script type="module">
        import RefreshRuntime from 'http://localhost:5173/@react-refresh'

        RefreshRuntime.injectIntoGlobalHook(window)

        window.$RefreshReg$ = () => {}
        window.$RefreshSig$ = () => (type) => type
        window.__vite_plugin_react_preamble_installed__ = true
    </script>

    <script
        type="module"
        src="http://localhost:5173/@vite/client"
    ></script>

    <script
        type="module"
        src="http://localhost:5173/src/main.jsx"
    ></script>

</body>

</html>
