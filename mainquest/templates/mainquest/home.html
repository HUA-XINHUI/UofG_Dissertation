{% extends "base.html" %}

{% block main %}

<div class="section-text">
    <h1>{{ section.id}}</h1>
    <h2>{{ unit.id}}</h2>
</div>

<div class="unit-button">
        <button class="left">
            left
        </button>
    {% for unit in section.units.all %}
        <button>
            {{ unit.id }}
        </button>
    {% endfor %}
        <button class="right">
            right
        </button>
</div>

{% endblock %}
