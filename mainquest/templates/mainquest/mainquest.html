{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link
        rel="stylesheet"
        href="{% static 'mainquest/css/mainquest.css' %}"
    >
{% endblock %}

{% block main %}

<div class="section-text">
    <h1>{{ section.id }}</h1>
    <h2>{{ unit.id }}</h2>
</div>

<form method="post">
    {% csrf_token %}

    <div class="unit-button">
            <button class="left">
                left
            </button>
        {% for unit in section.units.all %}
            <button type="button" class="open-button">
                {{ unit.id }}
            </button>
        {% endfor %}
            <button class="right">
                right
            </button>

            <input
                type="hidden"
                name="mainquest-request"
                id="mainquest-selected"
            >

    </div>

    <dialog id="unit-dialog">
        <h2>Unit {{ unit.id }}</h2>
        <p>This unit contains 10 questions.</p>

        <button type="button" id="close-button">
            Close
        </button>
    </dialog>

</form>

<script>
    const dialog = document.querySelector("#unit-dialog");
    const openButton = document.querySelectorAll(".open-button");
    const closeButton = document.querySelector("#close-button");

    openButton.forEach(function (button) {
        button.addEventListener("click", function () {
            dialog.showModal();
        });
    });

    closeButton.addEventListener("click", function () {
        dialog.close();
    });
</script>

{% endblock %}
